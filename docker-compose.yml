services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: infocreon-airquality-backend
    env_file:
      - ./backend/.env
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
    container_name: infocreon-airquality-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped